name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install the package without its heavy runtime deps: the tests mock the
      # dense side, so faiss and sentence-transformers are never imported here.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install nltk rank-bm25 numpy tqdm pytest ruff
      - name: Download nltk stopwords
        run: python -c "import nltk; nltk.download('stopwords')"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
